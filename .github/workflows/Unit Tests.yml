name: Unit Tests
on: pull_request

concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  quality-test:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Microsoft365DSC
        uses: ./.github/actions/setup-m365dsc

      - name: Run Quality Checks
        shell: pwsh
        run: |
          Import-Module './Tests/TestHarness.psm1' -Force;
          $MaximumFunctionCount = 32767

          try
          {
              $results = Invoke-QualityChecksHarness
          }
          catch
          {
              $MaximumFunctionCount = 32767
              Import-Module './Tests/TestHarness.psm1' -Force;
              $results = Invoke-QualityChecksHarness
          }
          if ($results.FailedCount -gt 0)
          {
              throw "{$($results.FailedCount)} Quality Check(s) Failed"
          }

  unit-test:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Microsoft365DSC
        uses: ./.github/actions/setup-m365dsc

      - name: Run Test Harness
        shell: pwsh
        run: |
          Import-Module './Tests/TestHarness.psm1' -Force;
          $MaximumFunctionCount = 32767
          $harnessParameters = @{
              IgnoreCodeCoverage = $true
              ShardIndex         = ${{ matrix.shard }}
              ShardCount         = ${{ strategy.job-total }}
          }

          try
          {
              $results = Invoke-TestHarness @harnessParameters
          }
          catch
          {
              $MaximumFunctionCount = 32767
              Import-Module './Tests/TestHarness.psm1' -Force;
              $results = Invoke-TestHarness @harnessParameters
          }
          if ($results.FailedCount -gt 0)
          {
              throw "{$($results.FailedCount)} Unit Test(s) Failed"
          }

  code-coverage:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Microsoft365DSC
        uses: ./.github/actions/setup-m365dsc

      - name: Run Code Coverage
        id: coverage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module './Tests/TestHarness.psm1' -Force;
          $MaximumFunctionCount = 32767

          $changedFiles = gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'
          $scope = Get-M365DSCTestCoverageScope -ChangedFile $changedFiles

          if ($scope.CoveragePath.Count -eq 0)
          {
              Write-Host -Object 'No resource or module file changed, skipping code coverage.'
              "measured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          Write-Host -Object "Measuring coverage of $($scope.CoveragePath.Count) file(s) with $(if ($scope.FullSuite) { 'the full test suite' } else { "$($scope.TestPath.Count) test file(s)" })."

          $results = Invoke-TestHarness -CodeCoveragePath $scope.CoveragePath -DscTestsPath $scope.TestPath
          "measured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $coverage = $results.CodeCoverage
          "### Code coverage: {0:n2}% ({1} of {2} commands)" -f $coverage.CoveragePercent, $coverage.CommandsExecutedCount, $coverage.CommandsAnalyzedCount |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($results.FailedCount -gt 0)
          {
              throw "{$($results.FailedCount)} Unit Test(s) Failed"
          }

      - name: Upload Code Coverage as Artifact
        if: steps.coverage.outputs.measured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Code Coverage Report
          path: coverage.xml
